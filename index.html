<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Seven Wonders</title>
    <meta name="description" content="Seven Wonders — the abstract strategy games by Simon Allmer. Walk the table in the Crystal Palace and step into a wonder.">
    <meta name="theme-color" content="#0d0b09">
    <link rel="icon" href="assets/SevenWondersSymbol.svg">
    <link rel="preload" href="assets/Ancient-Tulip.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="css/style.css">
    <script type="importmap">
        { "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
    </script>
</head>
<body class="state-intro">
    <canvas id="view"></canvas>

    <div id="ui">
        <a id="sa" href="https://simonallmer.com" title="simonallmer.com"><img src="assets/SALogo.png" alt="Simon Allmer"></a>
        <div id="brand">Seven Wonders</div>

        <!-- top right: who is playing -->
        <aside id="panel">
            <div class="seg" id="players-seg" role="group" aria-label="Number of players">
                <button data-players="2">2 Players</button>
                <button data-players="4">4 Players</button>
            </div>
            <ul id="seats"></ul>
            <div class="seg small" id="mode-seg" role="group" aria-label="Victory">
                <button data-mode="standard" title="Win on the summit, or once every rival has fewer than four stones">Standard</button>
                <button data-mode="conquest" title="Only the four victory fields win">Conquest</button>
            </div>
            <div class="tools">
                <button id="btn-sound" title="Sound (M)">Sound</button>
                <button id="btn-light" title="Daylight follows your clock (L)">Live</button>
                <button id="btn-rules" class="game-only" title="Rules (R)">Rules</button>
                <button id="btn-restart" class="game-only" title="Start again">Restart</button>
                <button id="btn-leave" class="game-only" title="Back to the exhibition (Esc)">Exhibition</button>
            </div>
        </aside>

        <!-- bottom: the wonder in front of you -->
        <section id="card">
            <button class="nav" id="nav-prev" aria-label="Previous wonder">‹</button>
            <div class="card-body">
                <div id="card-side"></div>
                <h1 id="card-name"></h1>
                <div id="card-place"></div>
                <p id="card-line"></p>
                <button id="card-play"></button>
            </div>
            <button class="nav" id="nav-next" aria-label="Next wonder">›</button>
        </section>
        <div id="hint">← → walk the table &nbsp;·&nbsp; Enter to step inside</div>

        <div id="status"></div>
        <div id="actions" hidden></div>
        <div id="toast"></div>

        <div id="rules" class="overlay" hidden>
            <article class="papyrus">
                <button class="close" id="rules-close" aria-label="Close">×</button>
                <img src="assets/pyramid-symbol.svg" alt="" class="sigil" id="rules-sigil">
                <h2 id="rules-title">Pyramid</h2>
                <div id="rules-text"></div>
            </article>
        </div>

        <div id="gameover" class="overlay" hidden>
            <div class="banner">
                <h2 id="over-title"></h2>
                <p id="over-text"></p>
                <div class="row">
                    <button id="over-again">Play again</button>
                    <button id="over-leave">Back to the Exhibition</button>
                </div>
            </div>
        </div>

        <div id="intro">
            <h1>Seven Wonders</h1>
            <button id="intro-enter" disabled>Preparing the hall…</button>
            <small>© 2020–2026 Simon Allmer Entertainment</small>
        </div>
    </div>

    <script>
        // opened by double-click: browsers will not load modules from file://, so say what to do instead
        if (location.protocol === 'file:') document.getElementById('intro-enter').textContent = 'Double-click “Play Seven Wonders.command” in this folder to play';
    </script>
    <script type="module" src="src/main.js"></script>
</body>
</html>
